name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dgu_ci
          POSTGRES_USER: dgu_ci
          POSTGRES_PASSWORD: dgu_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dgu_ci -d dgu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ENCRYPTION_KEY: ci-only-encryption-key-that-is-not-used-in-production
      SETUP_TOKEN: ci-only-setup-token
      SESSION_COOKIE_SECURE: "false"
      DATABASE_URL: postgresql+psycopg://dgu_ci:dgu_ci_password@127.0.0.1:5432/dgu_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: '["http://localhost"]'
      ALLOWED_HOSTS: '["localhost","testserver"]'
      RUN_GOOGLE_TEST_INTEGRATION: "0"
      CONTROL_CENTER_LIVE_ACTIONS_ENABLED: "false"
      WEB_RISK_ENABLED: "false"
      SPAMHAUS_DQS_ENABLED: "false"
      IPQS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e './backend[dev]'
      - name: Backend lint
        working-directory: backend
        run: ruff check app tests
      - name: Safety-critical type checks
        working-directory: backend
        run: mypy app/core/config.py app/api/routes/health.py --ignore-missing-imports
      - name: Alembic single-head and upgrade check
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          alembic current | grep -q '(head)'
      - name: Backend tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend type check
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --pool=forks --maxWorkers=1 --minWorkers=1
      - name: Production frontend build
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      APP_ENCRYPTION_KEY: ci-only-encryption-key-that-is-not-used-in-production
      SETUP_TOKEN: ci-only-setup-token
      POSTGRES_PASSWORD: dgu_ci_password
      CONTROL_CENTER_LIVE_ACTIONS_ENABLED: "false"
      WEB_RISK_ENABLED: "false"
      SPAMHAUS_DQS_ENABLED: "false"
      IPQS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Build application images
        run: docker compose build api frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
