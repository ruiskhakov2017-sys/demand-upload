x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost}
  APP_VERSION_SHA: ${APP_VERSION_SHA:-development}
  APP_RELEASE_TAG: ${APP_RELEASE_TAG:-}
  APP_DEPLOYED_AT: ${APP_DEPLOYED_AT:-}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-dev-only-change-before-production}
  SETUP_TOKEN: ${SETUP_TOKEN:-dev-setup-token}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dgu:dgu@postgres:5432/dgu}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://localhost:5173","http://127.0.0.1:5173"]}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
  STORAGE_ROOT: ${STORAGE_ROOT:-/var/lib/dgu/storage}
  GOOGLE_ADS_API_VERSION: ${GOOGLE_ADS_API_VERSION:-v24.2}
  CONTROL_CENTER_LIVE_ACTIONS_ENABLED: ${CONTROL_CENTER_LIVE_ACTIONS_ENABLED:-false}
  CONTROL_CENTER_DAILY_OPERATION_LIMIT: ${CONTROL_CENTER_DAILY_OPERATION_LIMIT:-15000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_KILL_SWITCH: ${AI_KILL_SWITCH:-false}
  AI_PRODUCTION_READ_ENABLED: ${AI_PRODUCTION_READ_ENABLED:-false}
  AI_PRODUCTION_ACTIONS_ENABLED: ${AI_PRODUCTION_ACTIONS_ENABLED:-false}
  AI_PAUSE_ACTIONS_ENABLED: ${AI_PAUSE_ACTIONS_ENABLED:-false}
  AI_ENABLE_ACTIONS_ENABLED: ${AI_ENABLE_ACTIONS_ENABLED:-false}
  AI_BUDGET_ACTIONS_ENABLED: ${AI_BUDGET_ACTIONS_ENABLED:-false}
  AI_DEMAND_GEN_ACTIONS_ENABLED: ${AI_DEMAND_GEN_ACTIONS_ENABLED:-false}
  AI_LIVE_RULES_ENABLED: ${AI_LIVE_RULES_ENABLED:-false}
  AI_MAX_MODEL_TURNS: ${AI_MAX_MODEL_TURNS:-4}
  AI_MAX_READ_TOOL_CALLS: ${AI_MAX_READ_TOOL_CALLS:-6}
  AI_MAX_DRAFT_TOOL_CALLS: ${AI_MAX_DRAFT_TOOL_CALLS:-1}
  AI_MAX_ROWS_PER_TOOL: ${AI_MAX_ROWS_PER_TOOL:-100}
  AI_MAX_DATE_RANGE_DAYS: ${AI_MAX_DATE_RANGE_DAYS:-90}
  AI_INTERACTIVE_TIMEOUT_SECONDS: ${AI_INTERACTIVE_TIMEOUT_SECONDS:-60}
  AI_RETENTION_DAYS: ${AI_RETENTION_DAYS:-30}
  AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
  AI_GLOBAL_RATE_LIMIT_PER_MINUTE: ${AI_GLOBAL_RATE_LIMIT_PER_MINUTE:-60}
  AI_MAX_CONCURRENT_RUNS: ${AI_MAX_CONCURRENT_RUNS:-2}
  AI_GLOBAL_MAX_CONCURRENT_RUNS: ${AI_GLOBAL_MAX_CONCURRENT_RUNS:-8}
  AI_DAILY_SOFT_BUDGET_USD: ${AI_DAILY_SOFT_BUDGET_USD:-5}
  AI_DAILY_HARD_BUDGET_USD: ${AI_DAILY_HARD_BUDGET_USD:-10}
  AI_MONTHLY_HARD_BUDGET_USD: ${AI_MONTHLY_HARD_BUDGET_USD:-100}
  AI_USER_DAILY_HARD_BUDGET_USD: ${AI_USER_DAILY_HARD_BUDGET_USD:-5}
  AI_USER_MONTHLY_HARD_BUDGET_USD: ${AI_USER_MONTHLY_HARD_BUDGET_USD:-50}
  AI_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${AI_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-3}
  AI_PROVIDER_CIRCUIT_COOLDOWN_SECONDS: ${AI_PROVIDER_CIRCUIT_COOLDOWN_SECONDS:-300}
  AI_VOICE_MAX_SECONDS: ${AI_VOICE_MAX_SECONDS:-60}
  AI_VOICE_MAX_BYTES: ${AI_VOICE_MAX_BYTES:-10485760}
  AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
  WEB_RISK_ENABLED: ${WEB_RISK_ENABLED:-false}
  WEB_RISK_API_KEY: ${WEB_RISK_API_KEY:-}
  SPAMHAUS_DQS_ENABLED: ${SPAMHAUS_DQS_ENABLED:-false}
  SPAMHAUS_DQS_KEY: ${SPAMHAUS_DQS_KEY:-}
  IPQS_ENABLED: ${IPQS_ENABLED:-false}
  IPQS_API_KEY: ${IPQS_API_KEY:-}
  DOMAIN_REPUTATION_ENFORCEMENT: ${DOMAIN_REPUTATION_ENFORCEMENT:-monitor}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dgu}
      POSTGRES_USER: ${POSTGRES_USER:-dgu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dgu} -d ${POSTGRES_DB:-dgu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${DGU_API_IMAGE:-demand-gen-uploader-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/lib/dgu/storage
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8000/api/ready"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  worker:
    image: ${DGU_WORKER_IMAGE:-demand-gen-uploader-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/lib/dgu/storage
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "worker", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.jobs.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout=30 | grep -q pong"]
      interval: 30s
      timeout: 90s
      retries: 5
      start_period: 30s

  scheduler:
    image: ${DGU_SCHEDULER_IMAGE:-demand-gen-uploader-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "beat", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; data = Path('/proc/1/cmdline').read_bytes(); raise SystemExit(0 if b'celery' in data and b'beat' in data else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${DGU_FRONTEND_IMAGE:-demand-gen-uploader-frontend:latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  reverse-proxy:
    image: caddy:2.8-alpine
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  app_storage:
