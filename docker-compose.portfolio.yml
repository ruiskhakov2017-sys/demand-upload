name: axyro-portfolio

x-portfolio-backend: &portfolio-backend
  image: axyro-portfolio-backend:local
  pull_policy: never
  environment: &portfolio-env
    APP_ENV: portfolio
    PORTFOLIO_PUBLIC_ACCESS_ENABLED: ${PORTFOLIO_PUBLIC_ACCESS_ENABLED:-false}
    APP_PUBLIC_BASE_URL: ${PORTFOLIO_PUBLIC_URL:-http://localhost:19082}
    APP_ENCRYPTION_KEY: ${PORTFOLIO_ENCRYPTION_KEY:?Set PORTFOLIO_ENCRYPTION_KEY}
    SETUP_TOKEN: ${PORTFOLIO_SETUP_TOKEN:?Set PORTFOLIO_SETUP_TOKEN}
    SESSION_COOKIE_SECURE: ${PORTFOLIO_SECURE_COOKIE:-false}
    SESSION_COOKIE_NAME: ${PORTFOLIO_COOKIE_NAME:-dgu_session}
    SESSION_COOKIE_PATH: ${PORTFOLIO_BASE_PATH:-/}
    DATABASE_URL: postgresql+psycopg://portfolio:${PORTFOLIO_DB_PASSWORD:?Set PORTFOLIO_DB_PASSWORD}@postgres:5432/axyro_portfolio
    REDIS_URL: redis://redis:6379/0
    ALLOWED_HOSTS: '${PORTFOLIO_ALLOWED_HOSTS:-["localhost", "127.0.0.1"]}'
    AI_ENABLED: 'false'
    CONTROL_CENTER_LIVE_ACTIONS_ENABLED: 'false'
  networks: [private]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axyro_portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?Set PORTFOLIO_DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD, pg_isready, -U, portfolio, -d, axyro_portfolio]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [private]

  initialize:
    <<: *portfolio-backend
    environment:
      <<: *portfolio-env
      PORTFOLIO_PASSWORD: ${PORTFOLIO_PASSWORD:?Set PORTFOLIO_PASSWORD}
    command: [sh, -ec, 'alembic upgrade head && python -m scripts.seed_portfolio']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *portfolio-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes: [app_storage:/var/lib/dgu/storage]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    <<: *portfolio-backend
    command: [celery, -A, app.jobs.celery_app.celery_app, worker, --loglevel=INFO]
    volumes: [app_storage:/var/lib/dgu/storage]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_started

  scheduler:
    <<: *portfolio-backend
    command: [celery, -A, app.jobs.celery_app.celery_app, beat, --loglevel=INFO, --schedule=/tmp/portfolio-beat]
    depends_on: [redis, worker]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BASE_PATH: ${PORTFOLIO_BASE_PATH:-/}
    networks: [private]

  showcase-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BASE_PATH: /showcase/
    networks: [private]

  reverse-proxy:
    image: caddy:2.8-alpine
    environment:
      DGU_SITE_ADDRESS: ':80'
    ports: ['127.0.0.1:19082:80']
    volumes: [./infrastructure/portfolio/Caddyfile:/etc/caddy/Caddyfile:ro]
    depends_on: [api, frontend, showcase-frontend]
    networks: [private, edge]

networks:
  private:
    internal: true
  edge:

volumes:
  postgres_data:
  app_storage:
