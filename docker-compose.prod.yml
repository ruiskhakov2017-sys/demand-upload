x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-production-app-env: &production-app-env
  APP_ENV: production
  SESSION_COOKIE_SECURE: "true"
  ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}'
  CONTROL_CENTER_LIVE_ACTIONS_ENABLED: "false"
  DOMAIN_REPUTATION_ENFORCEMENT: ${DOMAIN_REPUTATION_ENFORCEMENT:-monitor}

services:
  postgres:
    restart: unless-stopped
    logging: *production-logging

  redis:
    restart: unless-stopped
    logging: *production-logging

  api:
    restart: unless-stopped
    logging: *production-logging
    environment:
      <<: *production-app-env
    volumes: !override
      - ./storage:/var/lib/dgu/storage
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*

  worker:
    restart: unless-stopped
    logging: *production-logging
    environment:
      <<: *production-app-env
    volumes: !override
      - ./storage:/var/lib/dgu/storage

  scheduler:
    restart: unless-stopped
    logging: *production-logging
    environment:
      <<: *production-app-env

  frontend:
    restart: unless-stopped
    logging: *production-logging

  reverse-proxy:
    restart: unless-stopped
    logging: *production-logging
    environment:
      DGU_SITE_ADDRESS: ${DGU_SITE_ADDRESS:-http://localhost}
      DGU_WWW_SITE_ADDRESS: ${DGU_WWW_SITE_ADDRESS:-http://www.localhost}
      DGU_CANONICAL_URL: ${DGU_CANONICAL_URL:-http://localhost}
    ports: !override
      - "${DGU_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${DGU_HTTPS_BIND:-127.0.0.1:8443}:443"
      - "${DGU_HTTPS_UDP_BIND:-127.0.0.1:8443}:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "grep -aq caddy /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
